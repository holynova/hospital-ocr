<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">医疗单据 OCR 工作台 — Hospital OCR</title>
  <desc id="desc">浅灰绿底、青色强调：医疗单据 OCR 工作台；右侧是一张带扫描框的发票简图，旁边是提取出的日期、姓名、金额三个字段。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5f7f7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5d6b71">医疗发票与病历 · MEDICAL INVOICE &amp; RECORD OCR</text>
    <text x="56" y="128" font-size="56" font-weight="700" fill="#202d31">医疗单据 OCR 工作台</text>
    <text x="56" y="168" font-size="23" fill="#087969">HOSPITAL OCR — 图片不上传，全在浏览器本地识别</text>
    <text x="56" y="204" font-size="19" fill="#5d6b71">批量识别发票与病历，提取日期、金额、姓名，核对后导出。</text>
    <g id="chips" font-size="18" fill="#202d31" text-anchor="middle">
      <g><rect x="56" y="238" width="186" height="36" rx="18" fill="#e6efed" stroke="#c4d6d1" stroke-width="1.5"/><text x="149" y="262">PP-OCRv6 本地识别</text></g>
      <g><rect x="254" y="238" width="150" height="36" rx="18" fill="#e6efed" stroke="#c4d6d1" stroke-width="1.5"/><text x="329" y="262">3 个模型可选</text></g>
      <g><rect x="416" y="238" width="150" height="36" rx="18" fill="#e6efed" stroke="#c4d6d1" stroke-width="1.5"/><text x="491" y="262">批量 + 核对</text></g>
      <g><rect x="578" y="238" width="198" height="36" rx="18" fill="#e6efed" stroke="#c4d6d1" stroke-width="1.5"/><text x="677" y="262">ZIP · CSV · JSON · MD</text></g>
    </g>
  </g>

  <g id="invoice-motif" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="830" y="44" font-size="18" fill="#5d6b71">拍发票 → 识别 → 核对 → 导出</text>
    <!-- invoice card -->
    <g>
      <rect x="800" y="60" width="220" height="240" rx="8" fill="#ffffff" stroke="#d9e1e3" stroke-width="1.5"/>
      <text x="820" y="90" font-size="17" font-weight="700" fill="#202d31">医疗收费电子票据</text>
      <g stroke="#d9e1e3" stroke-width="1.5">
        <line x1="820" y1="102" x2="1000" y2="102"/>
        <line x1="820" y1="200" x2="1000" y2="200"/>
      </g>
      <g font-size="14" fill="#5d6b71">
        <text x="820" y="128">交款人：张三</text>
        <text x="820" y="154">开票日期：2024-01-02</text>
        <text x="820" y="180">检查费　100.00</text>
        <text x="820" y="228">金额合计（小写）123.45</text>
        <text x="820" y="254">金额合计（大写）壹佰</text>
        <text x="820" y="274">贰拾叁元肆角伍分</text>
      </g>
      <!-- scan frame -->
      <g stroke="#087969" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M812 84 v-14 a6 6 0 0 1 6 -6 h14"/>
        <path d="M1008 84 v-14 a6 6 0 0 0 -6 -6 h-14"/>
        <path d="M812 276 v14 a6 6 0 0 0 6 6 h14"/>
        <path d="M1008 276 v14 a6 6 0 0 1 -6 6 h-14"/>
      </g>
      <line x1="812" y1="180" x2="1008" y2="180" stroke="#087969" stroke-width="2" opacity="0.6"/>
    </g>
    <!-- extracted fields -->
    <g font-size="16">
      <g>
        <rect x="1036" y="76" width="128" height="56" rx="8" fill="#e6efed" stroke="#087969" stroke-width="1.5"/>
        <text x="1050" y="98" fill="#5d6b71">日期</text>
        <text x="1050" y="120" fill="#202d31" font-weight="700">2024-01-02</text>
      </g>
      <g>
        <rect x="1036" y="146" width="128" height="56" rx="8" fill="#e6efed" stroke="#087969" stroke-width="1.5"/>
        <text x="1050" y="168" fill="#5d6b71">姓名</text>
        <text x="1050" y="190" fill="#202d31" font-weight="700">张三</text>
      </g>
      <g>
        <rect x="1036" y="216" width="128" height="56" rx="8" fill="#e6efed" stroke="#087969" stroke-width="1.5"/>
        <text x="1050" y="238" fill="#5d6b71">总金额</text>
        <text x="1050" y="260" fill="#202d31" font-weight="700">123.45 元</text>
      </g>
    </g>
    <text x="1036" y="298" font-size="15" fill="#087969">置信度 97.4% ✓</text>
  </g>
</svg>
